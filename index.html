<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portofolio indah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
    <nav>
        <a href="index.html" class="logo">Indah<span class="logo-dot">.</span></a>
        <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About me</a></li>
            <li><a href="portfolio-projects.html">Portofolio</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="portfolio-hero" id="home">
        <div class="portfolio-left">
            <div class="hero-top">
                <div class="academy">
                    <div class="academy-logo">
                        <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 6L18 16L14 20L4 10L8 6Z" fill="#00d2ff"/>
                            <path d="M16 12L26 22L22 26L12 16L16 12Z" fill="#7e70ff"/>
                        </svg>
                    </div>
                    <div class="academy-info">
                        <span class="academy-name">Putra Bangsa</span>
                        <span class="academy-tagline">Universitas</span>
                    </div>
                </div>
            </div>

            <h1 class="portfolio-title">
                Port<span>folio</span>
                <span class="title-sparkle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0L14.8 9.2L24 12L14.8 14.8L12 24L9.2 14.8L0 12L9.2 9.2L12 0Z" fill="#00d2ff"/>
                    </svg>
                </span>
            </h1>

            <div class="subtitle-row">
                <div class="role" data-typing="Front-end Developer|UI/UX Designer|Figma Designer|Web Developer">Front-end Developer</div>
                <div class="name-badge">
                    <span class="name">Indah Ruwahna</span>
                    <span class="badge-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <div class="hero-actions-home" style="display: flex; gap: 14px; margin-top: 24px; align-items: center; flex-wrap: wrap;">
                <a href="assets/CV_Indah_Ruwahna.pdf" download="CV_Indah_Ruwahna.pdf" target="_blank" class="btn btn-cv">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>Unduh CV</span>
                </a>
                <a href="about.html" class="btn btn-profile-link" style="padding: 10px 22px; border-radius: 999px; border: 1px solid rgba(0, 210, 255, 0.4); color: #00d2ff; text-decoration: none; font-weight: 600; font-size: 0.9rem; backdrop-filter: blur(8px); transition: all 0.3s ease;">
                    Lihat Profil &rarr;
                </a>
            </div>
        </div>

        <div class="portfolio-right">
            <div class="neo-card">
                <!-- Top Header: year and major -->
                <div class="neo-header">
                    <span class="neo-year">2026</span>
                    <span class="neo-sub">TEKNIK INFORMATIKA</span>
                </div>

                <!-- Slanted top tape -->
                <div class="neo-tape tape-top">
                    <span class="tape-text">INFO // KOMINFO // UPB // FRONT-END //</span>
                </div>

                <!-- Polaroid Frame containing the photo -->
                <div class="polaroid-frame">
                    <div class="polaroid-img-container">
                        <img src="assets/foto indah.png" alt="Foto Indah">
                    </div>
                </div>

                <!-- Slanted name banner -->
                <div class="neo-name-banner">
                    INDAH RUWAHNA A.
                </div>

                <!-- Slanted bottom tape -->
                <div class="neo-tape tape-bottom">
                    <span class="tape-text">DEVELOPER // DESIGNER // FIGMA //</span>
                </div>

                <!-- Floating Magnifying Glass SVG -->
                <div class="floating-magnifier">
                    <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="28" cy="28" r="16" stroke="#ff2a85" stroke-width="4" fill="rgba(255, 42, 133, 0.15)"/>
                        <line x1="39" y1="39" x2="54" y2="54" stroke="#ff2a85" stroke-width="5" stroke-linecap="round"/>
                        <path d="M20 20A10 10 0 0 1 34 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>

                <!-- Interactive overlay controls -->
                <div class="neo-controls">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 3 21 3 21 9"/>
                        <polyline points="9 21 3 21 3 15"/>
                        <line x1="21" y1="3" x2="14" y2="10"/>
                        <line x1="3" y1="21" x2="10" y2="14"/>
                    </svg>
                </div>
            </div>
        </div>

        <button class="follow-btn">Follow</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
